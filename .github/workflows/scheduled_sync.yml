name: Scheduled Movie Review Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Run Go Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Pipeline Sync
        run: go run ./cmd/pipeline
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_SUMMARY_ACCOUNT_ID: ${{ secrets.CF_SUMMARY_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          CF_SUMMARY_DATABASE_ID: ${{ secrets.CF_SUMMARY_DATABASE_ID || secrets.CF_D1_DATABASE_ID }}
          CF_SUMMARY_API_TOKEN: ${{ secrets.CF_SUMMARY_API_TOKEN || secrets.CF_API_TOKEN }}
          MAX_MOVIES_PER_SYNC: ${{ secrets.MAX_MOVIES_PER_SYNC || '10' }}
          MIN_POPULARITY: ${{ secrets.MIN_POPULARITY || '20.0' }}
          RECENT_MONTHS: ${{ secrets.RECENT_MONTHS || '6' }}


