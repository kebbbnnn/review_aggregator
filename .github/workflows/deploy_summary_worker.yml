name: Deploy Cloudflare Summary Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker-summaries/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Summary Worker to Cloudflare (Account 2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'worker-summaries/package-lock.json'

      - name: Install Dependencies
        run: npm ci
        working-directory: worker-summaries

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        working-directory: worker-summaries
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_SUMMARY_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_SUMMARY_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
