name: Catalog Movie Sync

on:
  schedule:
    - cron: '30 */2 * * *'
  workflow_dispatch:

jobs:
  catalog:
    name: Catalog TMDB Movies
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download Cursor
        uses: actions/download-artifact@v4
        with:
          name: catalog-cursor
          path: .
        continue-on-error: true

      - name: Run Catalog Pipeline
        run: go run ./cmd/catalog --cursor=cursor.json
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Upload Cursor
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-cursor
          path: cursor.json
          overwrite: true
