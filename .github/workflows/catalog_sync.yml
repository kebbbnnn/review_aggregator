name: Catalog Movie Sync

on:
  schedule:
    - cron: '30 */2 * * *'
  workflow_dispatch:

jobs:
  catalog:
    name: Catalog TMDB Movies
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Restore Cursor State
        uses: actions/cache/restore@v4
        with:
          path: cursor.json
          key: catalog-cursor-${{ github.run_id }}
          restore-keys: |
            catalog-cursor-

      - name: Run Catalog Pipeline
        run: go run ./cmd/catalog --cursor=cursor.json
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Save Cursor State
        uses: actions/cache/save@v4
        if: always()
        with:
          path: cursor.json
          key: catalog-cursor-${{ github.run_id }}

      - name: Upload Cursor Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-cursor
          path: cursor.json
          if-no-files-found: ignore
          overwrite: true
